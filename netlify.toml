[build]
  command = "npm run netlify:build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify may set NODE_ENV=production while installing. Include the
  # build-time dev tools required by Next.js TypeScript checking.
  NPM_FLAGS = "--legacy-peer-deps --include=dev"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/migrations/**"]
